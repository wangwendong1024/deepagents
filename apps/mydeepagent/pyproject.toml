[project]
name = "mydeepagent"
version = "0.1.0"
description = "Metadata-driven business agent with enforced execution hooks"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "sqlglot>=27,<31",
    "langchain-openai>=1.7.3,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["pymysql>=1.1,<2"]

[project.scripts]
mydeepagent = "mydeepagent.cli:main"

[dependency-groups]
test = ["pytest>=8,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.15.22,<0.16", "ty>=0.0.62,<1"]

[tool.uv.sources]
deepagents = { path = "../../libs/deepagents", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ty.environment]
extra-paths = ["../../libs/deepagents"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
